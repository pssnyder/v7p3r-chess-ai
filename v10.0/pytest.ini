[pytest]
# PyTest configuration for v10.0 development

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add src to path
pythonpath = src

# Verbose output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    sprint1: Sprint 1 tests (data serialization)
    sprint2: Sprint 2 tests (architecture)
    sprint3: Sprint 3 tests (training)
    sprint4: Sprint 4 tests (quantization)
    slow: Slow tests (skip with -m "not slow")
    benchmark: Performance benchmark tests

# Coverage
[coverage:run]
source = src
omit = src/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
