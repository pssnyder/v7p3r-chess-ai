# V7P3R AI v5.0 - Training Configuration

# Model Architecture
model:
  input_dim: 26              # Current feature count (expandable to 40+)
  shared_dims: [256, 256, 128, 64]  # Deep architecture for future expansion
  policy_hidden: 64
  value_hidden: 32
  dropout: 0.3
  use_residuals: true        # Residual connections enabled

# Training Parameters
training:
  # Data
  batch_size: 256            # Mid-range, expandable to 512
  num_workers: 4
  pin_memory: true
  
  # Epochs and Early Stopping
  epochs: 100
  early_stopping_patience: 15
  save_every: 10             # Save checkpoint every N epochs
  
  # Loss Weights (adjustable)
  policy_weight: 1.0         # Policy loss weight
  value_weight: 0.1          # Value loss weight (increase to 0.2 if value underperforms)
  
  # Optimizer
  learning_rate: 0.001       # 1e-3
  weight_decay: 0.0001       # 1e-4 (L2 regularization)
  grad_clip: 1.0             # Gradient clipping threshold
  
  # Learning Rate Scheduler
  lr_patience: 5             # Reduce LR after N epochs without improvement
  lr_factor: 0.5             # Reduce LR by this factor
  min_lr: 0.000001           # 1e-6
  
  # Loss Functions
  huber_delta: 0.5           # Huber loss delta for value head
  
  # Checkpoints
  checkpoint_dir: 'checkpoints'

# Evaluation
evaluation:
  metrics:
    - policy_accuracy
    - policy_top2_accuracy    # Within best 2 grades
    - value_mae
    - value_correlation
  
# Logging
logging:
  log_dir: 'logs'
  tensorboard: false         # Enable TensorBoard logging (optional)
  save_predictions: false    # Save validation predictions for analysis
