# V7P3R AI v5.0 - Quick Test Configuration (2 epochs)

model:
  input_dim: 26
  shared_dims: [256, 256, 128, 64]
  policy_hidden: 64
  value_hidden: 32
  dropout: 0.3
  use_residuals: true

training:
  batch_size: 256
  num_workers: 4
  pin_memory: true
  
  epochs: 2
  early_stopping_patience: 15
  save_every: 1
  
  policy_weight: 1.0
  value_weight: 0.1
  
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  
  lr_patience: 5
  lr_factor: 0.5
  min_lr: 0.000001
  
  huber_delta: 0.5
  
  checkpoint_dir: 'checkpoints_test'

evaluation:
  metrics:
    - policy_accuracy
    - policy_top2_accuracy
    - value_mae
    - value_correlation

logging:
  log_dir: 'logs_test'
  tensorboard: false
  save_predictions: false
