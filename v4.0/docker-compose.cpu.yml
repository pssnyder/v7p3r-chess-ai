version: '3.8'

# CPU-only override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.cpu.yml up

services:
  training:
    deploy:
      resources:
        reservations: {}
    
    environment:
      - CUDA_VISIBLE_DEVICES=""
      - FORCE_CPU=true
    
    mem_limit: 16g
    memswap_limit: 16g
